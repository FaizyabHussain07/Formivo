# Minimal Supabase CLI configuration for Formivo.
# Used by `supabase link` / `supabase db push` / `supabase start`.
# Migrations live in ./migrations, local seed in ./seed.sql (local only).

project_id = "formivo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "app_private"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# Local email capture is provided by the CLI default; no override needed.
# Authentication. Email confirmation is required: a new account verifies a six-digit
# code before it can reach the dashboard. Point the hosted project's templates at the
# same content so local and production behave identically.
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enabled = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Your Formivo verification code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Formivo password"
content_path = "./supabase/templates/recovery.html"
